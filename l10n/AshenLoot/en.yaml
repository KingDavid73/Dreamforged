abilityControllerModifier: "Ability controller modifier"
abilityControllerModifierDescription: "Hold this controller button while pressing the configured Cycle or Activate button. Default: RB. Choose three distinct buttons. The underlying game binding may also fire."
abilityControllerCycle: "Controller: cycle ability"
abilityControllerCycleDescription: "While holding the modifier, press this button to select the next unlocked Dreamforged active ability. Default: D-pad Left."
abilityControllerUse: "Controller: activate ability"
abilityControllerUseDescription: "While holding the modifier, press this button to activate the selected Dreamforged ability. Targeted abilities use the crosshair. Default: D-pad Right."
