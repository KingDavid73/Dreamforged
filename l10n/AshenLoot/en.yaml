page: "Morrowind: Dreamforged"
generalSettings: "General and compatibility"
generalSettingsDescription: "Master controls, presets, processing cadence, and safety boundaries."
resetSettings: "Dreamforged-wide reset"
resetSettingsDescription: "Restore every Dreamforged settings group to its shipped defaults before a clean testing pass."
resetAllSettings: "Reset every Dreamforged setting"
resetAllSettingsDescription: "Restores every Dreamforged settings group to the shipped defaults. This is useful before a clean balance-testing pass."
resetAllSettingsButton: "Reset all Dreamforged settings to defaults"
scalingSettings: "Levels, gear score, and difficulty"
scalingSettingsDescription: "Player-level influence, rarity-aware gear pressure, enemy health/damage, and encounter bands. Levels above 100 continue scaling through an uncapped prestige multiplier."
encounterSettings: "Wilderness encounters"
encounterSettingsDescription: "Player-centered outdoor pressure, creature pools, group sizes, placement distances, victory respite, and settlement behavior."
dungeonSettings: "Dungeons and repeatable delves"
dungeonSettingsDescription: "Interior population budgets, guaranteed leaders, and dungeon repopulation."
bossSettings: "Promotions and world bosses"
bossSettingsDescription: "Champion/Elite/Unique chances, world-boss appearance, range, durability, and escalation."
lootSettings: "Loot, supplies, and containers"
lootSettingsDescription: "Generated drops, potions, container and loose-item remixing, ground placement, and rarity glow."
ammunitionPercent: "Ammunition drop chance (%) — max 100"
ammunitionPercentDescription: "Base chance for defeated enemies to carry a useful bundle of ordinary arrows or bolts. Marksman skill adds up to 50 points and carrying an appropriate ranged weapon adds 25; equipped bows and crossbows determine ammunition type. Dense encounters normalize the final chance. Default 15%."
spellTomePercent: "Curated spell-tome drop chance (%) — max 100"
spellTomePercentDescription: "Chance that an Accessory-family reward becomes one of 24 permanent Dreamforged spell tomes appropriate to encounter level. Magic-focused classes receive triple weight; non-magic characters receive half weight. Known spells and carried duplicates are excluded. Default 25%."
adaptiveLootDirector: "Adaptive loot pacing director"
adaptiveLootDirectorDescription: "Lets defeated enemies build a saved reward reserve. Promoted encounters may spend it steadily or in an occasional burst, while disappointing streaks make spending more likely. Disable for fixed per-enemy budgets."
lootDirectorStrength: "Loot director generosity — max 3"
lootDirectorStrengthDescription: "Scales credit earned and released by the adaptive reward director. 0.5 is restrictive, 1 is the intended single-player pace, and 2–3 approaches loot-pinata pacing."
lootDirectorReserve: "Maximum saved loot credit — max 500"
lootDirectorReserveDescription: "Caps how much unspent reward value the director can carry forward. A larger reserve permits rarer and larger spending sprees without increasing item-count limits."
lootDirectorSpreeChance: "Base loot spending-spree chance (%) — max 100"
lootDirectorSpreeChanceDescription: "Chance that a director payout releases a large share of saved credit. Reward hunger raises this chance after disappointing promoted encounters."
npcSettings: "NPCs, guards, and civilians"
npcSettingsDescription: "Hostile NPC equipment, guard upgrades, scavenging, and civilian defense."
interfaceSettings: "Interface and controls"
interfaceSettingsDescription: "Enemy target cards, loot browser hotkey, and controller mappings for advancement abilities."
Similar: "Similar creatures"
Random: "Random loaded creatures"
creaturePoolMode: "Additional monster pool"
creaturePoolModeDescription: "Similar keeps family and native power near the anchor. Random chooses uniformly from the full safe land-capable catalog at every player level, including Morrowind, both expansions, Tamriel Rebuilt, and loaded creature mods; the chosen actor is then scaled into the configured player encounter band."
excludeExtraCliffRacers: "Exclude cliff racers from additional monsters"
excludeExtraCliffRacersDescription: "Prevents extra encounter slots from cloning or selecting cliff racers. Existing native cliff racers remain."
groundGlow: "Colored light on ground loot"
groundGlowDescription: "Adds a small rarity-colored pulsing light beside new Dreamforged ground drops. The marker disappears after pickup."
autoSalvageCommon: "Auto-salvage newly acquired Common gear"
autoSalvageCommonDescription: "Immediately converts newly acquired Common Dreamforged gear into matching forging coins. Existing and equipped items are protected. Default off."
autoSalvageUncommon: "Auto-salvage newly acquired Uncommon gear"
autoSalvageUncommonDescription: "Immediately converts newly acquired Uncommon Dreamforged gear into matching forging coins. Existing and equipped items are protected. Default off."
autoSalvageRare: "Auto-salvage newly acquired Rare gear"
autoSalvageRareDescription: "Immediately converts newly acquired Rare Dreamforged gear into matching forging coins. Existing and equipped items are protected. Default off."
autoSalvageEpic: "Auto-salvage newly acquired Epic gear"
autoSalvageEpicDescription: "Immediately converts newly acquired Epic Dreamforged gear into matching forging coins. Existing and equipped items are protected. Default off."
autoSalvageLegendary: "Auto-salvage newly acquired Legendary gear"
autoSalvageLegendaryDescription: "Immediately converts newly acquired Legendary Dreamforged gear into matching forging coins. Existing and equipped items are protected. Default off."
autoSalvageRelic: "Auto-salvage newly acquired Relic gear"
autoSalvageRelicDescription: "Immediately converts newly acquired Relic Dreamforged gear into matching forging coins. Existing and equipped items are protected; Mythic artifacts can never be auto-salvaged. Default off."
randomizeContainers: "Randomize dungeon container contents"
randomizeContainersDescription: "Selected safe dungeon containers use ordinary, valuable-native, and native-enchanted loot tiers, then independently roll for affixed gear. Chests and locks improve tier, drop, and rarity odds. Quest, scripted and owned containers/items are protected."
containerLootPercent: "Container randomization chance (%) — max 100"
containerLootPercentDescription: "Base chance to remix each eligible dungeon container once. Regular selected containers use a 70/25/5 ordinary/valuable/native-enchanted gradient. Chests and locks improve it. Selected urns also have a separate 25% affixed-item roll; no dungeon cap."
randomizeLooseDungeonItems: "Remix loose dungeon items"
randomizeLooseDungeonItemsDescription: "One-time conservative pass over unowned, unscripted placed items in tombs and Daedric/Dwemer ruins. Books, existing enchanted gear, quest-like records, player-dropped items, containers, and other interiors are excluded."
looseDungeonItemPercent: "Loose item remix chance (%) — max 100"
looseDungeonItemPercentDescription: "Chance per eligible shelf or floor item. Selected items use 55% similar ordinary, 30% broader valuable, 10% native enchanted, and 5% Dreamforged gear tiers where applicable. Default 15%."
randomizeNpcInventories: "Randomize hostile NPC inventories"
randomizeNpcInventoriesDescription: "Remixes safe carried items with level-banded native gear, native enchanted gear, and rarer Dreamforged gear. Equipped items use the same gradient while preserving weapon/armor/clothing type. Quest and scripted items are protected."
npcInventoryPercent: "Hostile NPC inventory randomization chance (%) — max 100"
npcInventoryPercentDescription: "Chance to randomize each newly processed eligible hostile NPC inventory once."
npcAshenGearPercent: "NPC generated gear chance (%) — max 50"
npcAshenGearPercentDescription: "Base chance per eligible equipped or carried gear piece to become Dreamforged. Default 5%; Champions/Elites/Uniques reach 10/17/25%, world bosses 35%. Zero disables generated NPC gear. Independent rolls allow rare exceptional loadouts."
guardProgression: "Upgrade guards"
guardProgressionDescription: "Recognized guards receive stronger level scaling, higher-tier equipment and inventory remixing without becoming encounter anchors."
guardPower: "Guard power multiplier — max 2.5"
guardPowerDescription: "Multiplies upgraded guard health and strength. Default 1.35. Guard equipment also targets several levels above ordinary NPC gear."
exteriorSpread: "Outdoor spawn maximum range — max 8000"
exteriorSpreadDescription: "Farthest distance from the player used for director encounters. Placement favors the player's direction of travel and validated walkable ground. Default 2200."
exteriorSpawnMin: "Outdoor spawn minimum range — max 3000"
exteriorSpawnMinDescription: "Director enemies must appear at least this far from the player. Default 1200 keeps new groups outside immediate combat range."
outdoorDirectorInterval: "Outdoor director check interval (seconds) — max 60"
outdoorDirectorIntervalDescription: "Seconds between encounter rolls while the player is moving through unsafe exterior cells. Default 12. Existing enemies, low health, settlements, and victory respite can delay a roll."
outdoorDirectorChance: "Outdoor encounter base chance (%) — max 100"
outdoorDirectorChanceDescription: "Base chance per director check to create a forward encounter. Failed checks accumulate the pressure value below, so long empty stretches become progressively less likely. Default 35%."
outdoorPressureGain: "Pressure gained after a quiet roll (%) — max 50"
outdoorPressureGainDescription: "Added to the next encounter chance whenever a director roll fails. A successful encounter or promoted-enemy victory resets pressure. Default 15%."
creatureDenChance: "Creature den chance per encounter (%) — max 100"
creatureDenChanceDescription: "Chance that a successful outdoor encounter creates an experimental stationary Kwama Queen-based spawner instead of an ordinary group. Only one living den is allowed in the current cell. Default 12%."
creatureDenWaveInterval: "Creature den wave interval (seconds) — max 120"
creatureDenWaveIntervalDescription: "Delay between a den's spawn cycles after its first five-second warning period. Waves respect the shared outdoor threat budget. Default 18 seconds."
creatureDenMinCycles: "Minimum creature den spawn cycles — max 6"
creatureDenMinCyclesDescription: "Fewest waves produced by a newly generated den if it survives and sufficient threat budget remains. Default 1."
creatureDenMaxCycles: "Maximum creature den spawn cycles — max 6"
creatureDenMaxCyclesDescription: "Most waves produced by a newly generated den. Den tier controls wave size and durability; default 3."
exteriorTriggerMin: "Anchor activation minimum range — max 2000"
exteriorTriggerMinDescription: "Native creatures closer than this wait before rolling as spawn anchors. Default 300 avoids generating reinforcements after the player is already in melee range."
exteriorAnchorChance: "Native creature anchor chance (%) — max 100"
exteriorAnchorChanceDescription: "Chance that each eligible native exterior creature produces one additional group when approached. Each native creature rolls once; generated enemies can never become anchors. Default 65%."
exteriorGroupMin: "Minimum enemies per exterior group — max 10"
exteriorGroupMinDescription: "Smallest group produced by a successful outdoor director roll. Default 1."
exteriorGroupMax: "Maximum enemies per exterior group — max 10"
exteriorGroupMaxDescription: "Largest group produced by a successful outdoor director roll. Default 3."
supplyContainers: "Supplement dungeon containers"
supplyContainersDescription: "Add healing to up to two unowned, unscripted containers when assigning a dungeon leader. Existing contents remain."
Crawler: "Dungeon crawler (25% promotions / 35% equipment)"
Bottom: "Bottom center"
Left: "Left side"
Top: "Below top HUD"
progression: "Scale new encounters to player level"
progressionDescription: "Saved encounters keep their roll. Only new hostile actors change."
levelScaling: "Player level influence — max 2"
levelScalingDescription: "0 preserves native creature levels. Above 0 blends new creatures toward the player and clamps them to the configured level band; 0.6 retains meaningful native differences."
gearLevelInfluence: "Gear influence on encounter level — max 1"
gearLevelInfluenceDescription: "How strongly the best equipable combination of tracked Dreamforged gear raises encounter level and promoted-enemy durability. Rarity adds substantial effective levels. Champions receive 25% of overgear health pressure, Elites 50%, Uniques 75%, and world bosses 100%; ordinary enemies receive none. Stronger gear also improves promoted rarity rolls and raises world-boss Mythic chance."
encounterLevelBelow: "Creature levels below player — max 20"
encounterLevelBelowDescription: "Lowest ordinary creature target relative to player level. Default 4; never below level 1. Applies only when progression is enabled."
encounterLevelAbove: "Creature levels above player — max 30"
encounterLevelAboveDescription: "Highest ordinary creature target relative to player level. Default 10, allowing dangerous areas without level-50 enemies at level 1. Elite powers and boss bonuses are additional."
enemyHealth: "Ordinary enemy health multiplier — max 3"
enemyHealthDescription: "Applied once to new hostiles. Promotion bonuses are additional."
enemyDamage: "Enemy strength multiplier — max 3"
enemyDamageDescription: "Scales strength as a physical damage proxy, not spell damage."
npcProgression: "Hostile NPC progression"
npcProgressionDescription: "Eligible hostile NPCs receive gear and caster spells. Quest actors, services and companions remain protected."
creatureVariety: "Creature replacement chance (%) — max 100"
creatureVarietyDescription: "Chance to replace a distant eligible creature once. Similar uses themed families; Random uses the broad safe loaded encounter pool."
extraEncounters: "Additional encounter groups"
extraEncountersDescription: "Runs a player-centered pressure director outdoors and retains the existing anchor-based additions in hostile interiors. Outdoor enemies are placed ahead on validated walkable ground and immediately pursue the player."
encounterDensity: "Encounter density multiplier — max 3"
encounterDensityDescription: "Multiplies the outdoor living-enemy cap and the established interior addition budget. Supply chances are gently normalized as density rises."
exteriorBudget: "Outdoor threat budget — max 30"
exteriorBudgetDescription: "Base budget for living director enemies near the player, multiplied by encounter density. Enemies near the player's combined level/gear power cost about one point; deliberately weaker enemies cost less, allowing larger late-game groups. Dens cost two points and their waves share this budget. Default 6."
exteriorTriggerRange: "Anchor activation maximum range — max 8000"
exteriorTriggerRangeDescription: "Native creatures in any active exterior cell can roll as anchors when they enter the configured minimum–maximum band around the player. Default 2200 catches visible encounters before combat without spending budgets across the entire loaded world."
rerunnableWilderness: "Repopulate wilderness cells"
rerunnableWildernessDescription: "Clears old per-cell wilderness processing state after the configured absence. The outdoor director itself remains travel-driven and does not use a lifetime cell quota."
wildernessResetHours: "Wilderness reset time (game hours) — max 720"
wildernessResetHoursDescription: "Game hours outside an exterior cell before its old wilderness processing state refreshes. Default 72. Promoted-enemy victory respite uses real-time seconds instead."
interiorBudget: "Extra enemies per dungeon cell — max 8"
interiorBudgetDescription: "Additional-actor budget in recognized hostile interiors. Rerun waves reuse this size after the reset delay."
rerunnableDungeons: "Repopulate cleared dungeons"
rerunnableDungeonsDescription: "After a recognized dungeon is cleared, left, and old enough, create a new level-scaled enemy wave at previously occupied safe positions. Native corpses and quest state are not reset."
dungeonResetHours: "Dungeon reset time (game hours) — max 720"
dungeonResetHoursDescription: "Hours that must pass after clearing before a dungeon can repopulate on re-entry. Default 72. Waiting inside does not spawn enemies around the player."
worldBosses: "Random world bosses"
worldBossesDescription: "Adds World Boss as the highest result on the normal promotion ladder. Only genuinely aggressive actors that first become promoted enemies can roll it. Each boss makes six rewards from its own base table: 1% Common, 2% Uncommon, 7% Rare, 20% Epic, 30% Legendary, 20% Relic, and 20% Mythic. Level, overgear, and configured enemy difficulty can promote results upward. Their combat reinforcement timing, wave size, and living cap are configurable below."
worldBossChance: "World Boss chance per promotion (%) — max 100"
worldBossChanceDescription: "Conditional chance that each successfully promoted, eligible aggressive enemy becomes a World Boss instead of Champion, Elite, or Unique, provided the active-cell cap is not already full. Default 3%."
worldBossCellCap: "Active World Bosses per cell — max 10"
worldBossCellCapDescription: "Hard ceiling on living World Bosses in one active cell. Default 1 prevents a lucky reinforcement group from becoming several add-summoning bosses. When a boss dies or leaves the cell, a later promotion may fill the open slot."
worldBossMinLevel: "Minimum player level for world bosses — max 50"
worldBossMinLevelDescription: "Promoted enemies encountered below this player level cannot become World Bosses. Default 5."
worldBossRange: "World boss health-bar range — max 10000"
worldBossRangeDescription: "Shows the persistent boss name and health bar while its living boss is this many units away in the active cell. Default 5000."
settlementSuppression: "Suppress extra encounters in settlements"
settlementSuppressionDescription: "When enabled, exterior cells with at least two peaceful NPCs receive no replacements or additional groups. Disable for populated-town chaos; guards are never used as monster-spawn anchors."
dungeonBosses: "Minimum elite in recognized dungeon cells"
dungeonBossesDescription: "First eligible hostile becomes elite. Per-cell fallback: connected dungeons may have several leaders."
uniquePercent: "Unique chance after World Boss roll (%) — max 100"
uniquePercentDescription: "Conditional chance that a promoted enemy which did not become a World Boss becomes a Unique with three compatible powers. Default 5%."
eliteTierPercent: "Elite chance after Unique roll (%) — max 100"
eliteTierPercentDescription: "Conditional chance that a remaining promoted enemy becomes an Elite with two powers. Default 25%. Enemies that miss this roll become Champions with one power."
worldBossAddInitialDelay: "Boss first reinforcement delay (seconds) — max 300"
worldBossAddInitialDelayDescription: "Seconds of active combat with the player before a World Boss calls its first reinforcement wave. Default 20; zero allows an immediate first wave."
worldBossAddInterval: "Boss reinforcement interval (seconds) — max 300"
worldBossAddIntervalDescription: "Minimum seconds between later World Boss reinforcement attempts. Default 30; minimum 5. A full living-add cap suppresses waves until space opens."
worldBossAddMin: "Minimum enemies per boss wave — max 10"
worldBossAddMinDescription: "Smallest reinforcement wave a World Boss attempts. Default 1. If this exceeds the maximum, the two values are automatically treated as an ordered range."
worldBossAddMax: "Maximum enemies per boss wave — max 10"
worldBossAddMaxDescription: "Largest reinforcement wave a World Boss attempts. Default 3. Remaining living-add capacity can reduce the actual wave."
worldBossAddCap: "Maximum living adds per World Boss — max 30"
worldBossAddCapDescription: "Maximum surviving reinforcements tracked for each World Boss. Default 6. Dead adds free capacity; zero disables World Boss reinforcement waves entirely."
healingPercent: "Healing potion drop chance (%) — max 100"
healingPercentDescription: "Creatures and hostile NPCs drop healing independently of equipment; strength follows encounter level."
supplyPercent: "Additional supply chance (%) — max 100"
supplyPercentDescription: "Chance of a fatigue/magicka draught or generated combat scroll."
groundDrops: "Drop generated equipment on the ground"
groundDropsDescription: "Places generated equipment in a forward-biased fan between the corpse and player, avoiding backward drops into walls. Disable to place every reward inside the corpse. Supplies stay on bodies. Default on."
scavenge: "NPCs scavenge nearby equipment"
scavengeDescription: "Idle nonquest NPCs collect useful unowned weapons and armor. Fresh procedural rewards remain reserved for the player until picked up; items the player later drops are ordinary unowned gear and can be collected. Existing travel/follow/escort jobs are protected."
civilianDefense: "Civilian close-range monster defense"
civilianDefenseDescription: "Attacked civilians above 20% health fight nearby creatures. Does not initiate combat against players."
pageDescription: "Morrowind: Dreamforged 0.10.3: canonical rarity-colored ground loot and overflow-safe rarity rolls."
settings: "Loot, encounters and compatibility"
settingsDescription: "Saved per character and organized below by system. New characters default to Dungeon crawler. Existing encounters retain their rolls."
enabled: "Enable Dreamforged"
enabledDescription: "Enable new rolls, elite hit effects and the loot UI. Already applied passive abilities and generated items remain in this save."
preset: "Chance preset"
presetDescription: "Dungeon crawler: 25% promotions / 35% equipment. Testing: 50/100. Balanced: 16/12. Custom uses the two percentages below. Density and supplies are separate settings."
Testing: "Testing (50% elites / 100% drops)"
Balanced: "Balanced (16% elites / 12% drops)"
Custom: "Custom percentages"
elitePercent: "Custom promotion chance (%) — max 100"
elitePercentDescription: "Used only with the Custom preset. Each newly processed eligible hostile independently rolls this chance to enter the promotion ladder. A success then rolls World Boss, Unique, and Elite in order; Champion is the fallback."
dropPercent: "Custom ordinary drop chance (%) — max 100"
dropPercentDescription: "Used only with Custom. Base success chance for each ordinary reward attempt. Promotions gain more attempts, a higher success chance, and better rarity weighting."
settleSeconds: "Wait after activation or randomization (seconds) — max 10"
settleSecondsDescription: "Promotion waits this long after activation, a base-health change, or World Randomizer actor events. Disabled/replaced actors cannot be promoted or rewarded. Default 2 seconds."
protectQuestActors: "Protect scripted and essential actors"
protectQuestActorsDescription: "Skip scripted or essential creature records. Disable to include them too. Service providers and companions remain protected; NPCs require the separate opt-in."
allowRespawningNPCs: "Also promote respawning NPCs"
allowRespawningNPCsDescription: "Optional NPC coverage. All creature record IDs are already supported, including Tamriel Rebuilt."
unsafeContent: "Unsafe chaos: include protected actors and items"
unsafeContentDescription: "OFF by default. When enabled, scripted, essential, unique, service, companion, artifact, quest, and normally excluded records join Dreamforged actor and item pools. Allows outcomes such as world-boss Vivec and affixed Keening copies, but can break quests, replace important inventory items, disrupt services, and produce nonsensical encounters. Turning it off does not undo changes already made."
showTargetCard: "Show Dreamforged target cards"
showTargetCardDescription: "Show every hostile crosshair target's name and health at top center. Living promotions show compact power names; promoted corpses replace that card with full descriptions. World Bosses use the dedicated bottom bar. Ground items use only OpenMW's native activation box."
inventoryKey: "Loot browser key"
inventoryKeyDescription: "Use the arrows to choose F6-F11. Press that key to open or advance pages; Shift plus the key closes the browser. Choose a key unused by other mods."
forgeKey: "Reforging exchange key"
forgeKeyDescription: "Opens the Dreamforged salvage and reforging exchange. Default F7 avoids OpenMW's F2 shader, F3/F4 performance/debug, F5 quick-save, F9 quick-load, and F10 Lua debug bindings. Equipped items are never offered for salvage."
